<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organy Alicji · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1a; --ink:#ece8df; --dim:#7d828c; --accent:#ffc861; --accent2:#7cc4ff; --pink:#ff6fa8;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --round:'Outfit', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);font-family:var(--mono);
  background:radial-gradient(1200px 700px at 50% 40%, #1a1f45, #0b0d1a 70%)}

/* ===== Alicja – dymek (jak w pokazach) ===== */
/* dymek leży na klawiaturze organów (położenie liczy pilnuj()) */
#talk{position:absolute;left:60px;bottom:20px;width:1000px;height:150px;z-index:4;overflow:hidden;
  background:rgba(10,12,26,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  border:1px solid rgba(255,200,97,.25);border-radius:12px;padding:12px 22px;pointer-events:none}
/* kliknięcia przechodzą przez dymek do organów (klawisze grają myszką); klikalny zostaje tylko przycisk na końcu */
#koniec button{pointer-events:auto}
/* na stole gry: bez tła — same litery z ciemnym obrysem, czytelne na białych i czarnych klawiszach */
#talk.stol{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
#talk.stol .line,#talk.stol #who{color:#fff;font-weight:600;
  text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
#talk.stol #who{color:#ffd27a}
#talk.stol .line.old{opacity:.75}
#talk.stol #koniec button{background:rgba(10,12,26,.88)}
#who{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
#log{display:flex;flex-direction:column;gap:8px}
.line{font-size:23px;line-height:1.45;transition:opacity .5s}
.line.old{opacity:.4}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--accent);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#koniec{display:none;gap:10px;margin-top:12px;flex-wrap:wrap}
#koniec.on{display:flex}
#koniec button{font:inherit;font-size:17px;background:transparent;color:var(--ink);border:1px solid rgba(255,200,97,.55);border-radius:999px;padding:9px 18px;cursor:pointer;animation:pop .35s both}
#koniec button:hover{background:rgba(255,200,97,.14)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== górny pasek ===== */
#tytul{position:fixed;top:18px;left:0;right:0;text-align:center;font:600 13px var(--round);letter-spacing:.3em;text-transform:uppercase;color:var(--accent);z-index:20;opacity:0;transition:opacity .6s}
#tytul.on{opacity:1}
.ikb{position:fixed;top:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;z-index:40}
#mute{right:18px} #readBtn{right:68px} #pauzaBtn{right:118px} #cofnijBtn{right:168px;font-size:16px}
#pauzaBtn.on{background:rgba(255,200,97,.25);border-color:#ffc861}
/* demo wskazuje pauzę: złota obwódka miga */
#pauzaBtn.swieci{border:3px solid #ffd27a;animation:dmMiga 1s ease-in-out infinite}
#pauzaInfo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;display:none;padding:18px 34px;border-radius:999px;background:rgba(10,12,26,.82);border:1px solid rgba(255,200,97,.6);color:#ffd27a;font:800 22px var(--round);cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#pauzaInfo.on{display:block}
.ikb.off{opacity:.45}

/* ===== scena pokazu: stałe pudełko 1200×620 skalowane do okna ===== */
#scena{position:fixed;left:50%;top:50%;width:1120px;height:800px;transform-origin:center;z-index:5}
#kam{position:absolute;inset:0}

/* ===== start ===== */
#start{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;background:radial-gradient(1000px 600px at 50% 45%, #1d2350, #0b0d1a 70%)}
#start h1{margin:0;font:800 64px var(--round);color:#fff;text-shadow:0 10px 40px rgba(255,120,180,.35)}
#start p{margin:10px 0 28px;font:300 20px var(--round);color:#dfe3ff}
#start button{font:600 22px var(--round);padding:16px 40px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(100deg,#ffd27a,#ffb347);color:#1a1300;box-shadow:0 14px 40px rgba(255,180,70,.45)}
#start small{display:block;margin-top:22px;font:14px var(--round);color:var(--dim)}

/* =========================================================
   DEMO: prawdziwe Organy Alicji w okienku + wskazówki Alicji na wierzchu
   ========================================================= */
.dm-org{position:absolute;inset:0;width:1120px;height:800px;border:0;background:transparent;opacity:0;transition:opacity 2s ease}
.dm-org.on{opacity:1}
.dm-wierzch{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
/* ramka wokół tego, o czym mówi Alicja */
.dm-ramka{position:absolute;border:3px solid #ffd27a;border-radius:14px;box-shadow:0 0 0 4px rgba(255,200,97,.25),0 0 28px rgba(255,200,97,.65);opacity:0;transition:opacity .6s}
.dm-ramka.on{opacity:1}
.dm-ramka.miga.on{animation:dmMiga 1s ease-in-out infinite}
@keyframes dmMiga{50%{opacity:.25;box-shadow:0 0 0 2px rgba(255,200,97,.1),0 0 8px rgba(255,200,97,.2)}}
/* strzałka: wskazuje z lewej strony na środek celu i lekko się kołysze */
.dm-strzalka{position:absolute;width:120px;height:60px;opacity:0;transition:opacity .6s}
.dm-strzalka.on{opacity:1}
.dm-strzalka svg{display:block;width:100%;height:100%;animation:dmKolys 1.1s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,200,97,.8))}
@keyframes dmKolys{50%{transform:translateX(-14px)}}
/* ramka „Pobierz głos demo” — jedyna rzecz w demo, w którą się klika */
.dm-pobierz{position:absolute;left:40px;top:28px;width:470px;padding:18px 22px 20px;border-radius:14px;pointer-events:auto;z-index:5;
  background:rgba(20,12,6,.94);border:3px solid #ffd27a;box-shadow:0 0 0 4px rgba(255,200,97,.25),0 0 30px rgba(255,200,97,.55),0 20px 60px rgba(0,0,0,.6);
  font:400 17px/1.45 var(--round);color:#f3ead6;opacity:0;transform:translateY(-8px);transition:opacity .5s,transform .5s}
.dm-pobierz.on{opacity:1;transform:none}
.dm-pobierz b{color:#ffd27a}
.dm-pobierz .pr{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dm-pobierz a,.dm-pobierz button{font:600 17px var(--round);padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;border:1px solid rgba(255,200,97,.55);background:transparent;color:#f3ead6}
.dm-pobierz a.gl,.dm-pobierz button.gl{background:linear-gradient(100deg,#ffd27a,#ffb347);color:#1a1300;border:0}
.dm-pobierz a:hover,.dm-pobierz button:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div id="start"><div>
  <h1>Organy Alicji</h1>
  <p>Zobacz demo</p>
  <button id="graj">▶ Pokaż</button>
  <small>Najlepiej ze słuchawkami albo głośnikami.</small>
</div></div>

<div id="tytul"></div>
<button id="mute" class="ikb" title="stukanie klawiszy">🔊</button>
<button id="readBtn" class="ikb" title="czytaj na głos">🗣</button>
<button id="pauzaBtn" class="ikb" title="pauza (spacja)">⏸</button>
<button id="cofnijBtn" class="ikb" title="cofnij 5 sekund">⏪</button>
<div id="pauzaInfo">⏸ Pauza · kliknij albo spacja, żeby wznowić</div>
<div id="scena"><div id="kam"></div><div id="talk"><div id="who">Alicja</div><div id="log"></div><div id="koniec"></div></div></div>

<script>
/* =========================================================
   ZOBACZ DEMO — wycieczka po Organach Alicji
   Ten sam sposób co pokazy Alicji: sceny, a w każdej to, co widać, i to, co mówi Alicja.
   Na scenie grają prawdziwe Organy Alicji (cały program zapisany niżej w ORGANY_SRC).
   ========================================================= */
const $ = s => document.querySelector(s);
// PAUZA: czekanie liczy czas tylko wtedy, gdy pokaz nie stoi
let pauza = false;
const czekaj = ms => new Promise(r => { let zostalo = ms, t0 = performance.now();
  const tik = () => { const t = performance.now(); if (!pauza) zostalo -= t - t0; t0 = t; if (zostalo <= 0) r(); else setTimeout(tik, Math.min(40, zostalo)); };
  setTimeout(tik, Math.min(40, Math.max(0, ms))); });
function ustawPauze(wl){
  if (wl === pauza) return; pauza = wl;
  $('#pauzaBtn').classList.toggle('on', wl); $('#pauzaBtn').textContent = wl ? '▶' : '⏸'; $('#pauzaInfo').classList.toggle('on', wl);
  try { if (AC){ wl ? AC.suspend() : AC.resume(); } } catch(e){}
  try { if (window.speechSynthesis){ wl ? speechSynthesis.pause() : speechSynthesis.resume(); } } catch(e){}
  document.getAnimations().forEach(a => { try { wl ? a.pause() : a.play(); } catch(e){} });
}
const log = $('#log');
let gen = 0, hurry = false, muted = false, readOn = 'speechSynthesis' in window;

/* ---------- skalowanie sceny do okna ---------- */
function dopasuj(){ const gora = 56, dol = 10, wol = innerHeight - gora - dol, s = Math.min(innerWidth / 1140, wol / 810, 1.5);
  $('#scena').style.top = (gora + wol / 2) + 'px'; $('#scena').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', dopasuj); dopasuj();

/* ---------- stukanie klawiszy, gdy Alicja pisze bez głosu ---------- */
let AC = null, noiseBuf = null;
function audioInit(){
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * .05), AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch(e){}
}
let tickN = 0;
function tick(ch){
  if (!AC || muted || readOn || ch === ' ' || ++tickN % 3) return;
  const t = AC.currentTime, src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 1.4 + Math.random() * .4;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
  const g = AC.createGain(); g.gain.value = .14; src.connect(hp).connect(g).connect(AC.destination); src.start(t);
}

/* ---------- Alicja mówi: pisanie w dymku (+ czytanie na głos) ---------- */
// JEDEN GŁOS ALICJI: polski Google (albo pierwszy polski), ton 1,05; w demo mówi odrobinę szybciej (tempo 1,12).
function mowGlosem(t, koniec){
  if (!window.speechSynthesis){ koniec(); return; }
  const u = new SpeechSynthesisUtterance(t), pl = speechSynthesis.getVoices().filter(v => /^pl/i.test(v.lang));
  u.voice = pl.find(v => /google/i.test(v.name)) || pl[0] || null; u.lang = 'pl-PL'; u.rate = 1.12; u.pitch = 1.05;
  u.onend = u.onerror = koniec; speechSynthesis.speak(u);
}
function glosik(t){ if (!readOn) return { done: true }; const st = { done: false }; mowGlosem(t, () => st.done = true); return st; }
function cisza(){ if (window.speechSynthesis) speechSynthesis.cancel(); }
async function powiedz(t, g){
  const line = document.createElement('div'); line.className = 'line';
  const span = document.createElement('span'), caret = document.createElement('i'); caret.className = 'caret';
  line.append(span, caret); log.appendChild(line);
  [...log.children].forEach((l, i, a) => l.classList.toggle('old', i < a.length - 1));
  while (log.children.length > 2) log.firstChild.remove();
  hurry = false; const gl = glosik(t), c = cofka;
  for (let i = 0; i < t.length; i++){
    if (g !== gen || c !== cofka){ caret.remove(); return; }
    if (hurry){ span.textContent = t; break; }
    span.textContent = t.slice(0, i + 1); tick(t[i]);
    await czekaj(/[.,?!…:—]/.test(t[i]) ? 150 : 24);
  }
  caret.remove();
  while (!gl.done && g === gen && !hurry && c === cofka) await czekaj(80);
  if (c !== cofka) return;
  await czekaj(hurry ? 250 : 700);
}
$('#talk').addEventListener('click', e => { if (!e.target.closest('button')) hurry = true; });
$('#pauzaBtn').onclick = () => ustawPauze(!pauza);
$('#pauzaInfo').onclick = () => ustawPauze(false);
const spacja = e => { if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName) && $('#start').style.display === 'none'){ e.preventDefault(); ustawPauze(!pauza); } };
addEventListener('keydown', spacja);
$('#mute').onclick = () => { muted = !muted; $('#mute').classList.toggle('off', muted); $('#mute').textContent = muted ? '🔇' : '🔊'; };
$('#readBtn').onclick = () => { readOn = !readOn; $('#readBtn').classList.toggle('off', !readOn); if (!readOn) cisza(); };

/* =========================================================
   ORGANY W OKIENKU
   ========================================================= */
const ORGANY_SRC = "\n<!DOCTYPE html>\n<html lang=\"pl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Organy Alicji<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root { --drewno1: #4a2a17; --drewno2: #2e190d; --kosc: #f3ead6; --zloto: #d8b46a; }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; }\n  body { background: radial-gradient(ellipse at 50% 0%, #2a2238, #0d0b14 70%); color: #f3ead6; font-family: 'Outfit', system-ui, sans-serif;\n         display: grid; place-items: center; overflow: hidden; user-select: none; }\n  #skala { transform-origin: center center; }\n\n  /* ===== stół gry: drewniana szafa ===== */\n  .stol { width: 1040px; padding: 22px 26px 26px; border-radius: 16px 16px 10px 10px;\n          background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 6%, transparent 94%, rgba(0,0,0,.25)),\n                      repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 3px, transparent 3px 11px),\n                      linear-gradient(180deg, var(--drewno1), var(--drewno2));\n          box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.08); border: 1px solid #1a0e07; }\n  .gora { display: grid; grid-template-columns: 230px 1fr 250px; gap: 18px; align-items: stretch; }\n\n  /* wyciągi rejestrów */\n  .wyciagi { border-radius: 10px; padding: 14px 10px; background: linear-gradient(180deg, #3a2112, #26150a);\n             box-shadow: inset 0 2px 8px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; gap: 10px; }\n  .wyciagi h3 { margin: 0; font: 700 11px 'Cinzel', serif; letter-spacing: .2em; color: var(--zloto); opacity: .8; }\n  .rejestr { position: relative; width: 92px; height: 92px; border: 0; padding: 0; background: none; cursor: pointer; }\n  .rejestr .tuleja { position: absolute; inset: 14px x; height: 15px; cursor: pointer; }\n  .rzad input[type=range] { width: 170px; accent-color: var(--zloto); }\n  #status { font-size: 12px; color: #b59f78; margin-top: 8px; min-height: 30px; }   /* miejsce na dwie linijki komunikatu — dłuższy komunikat nie rozpycha konsoli */\n  /* przycisk MIDI po starcie: 5 razy delikatnie miga (co sekundę) złotą ramką i poświatą, potem przestaje */\n  #midi.zwraca { animation: zwracaUwage 1s ease-in-out 5; }\n  /* PROSPEKT: przy graniu utworu konsola przenika w obrazek organów; klik w obrazek — powrót do konsoli */\n  .prospekt { position: absolute; inset: 0; z-index: 2; border-radius: 10px; padding: 10px; cursor: pointer;\n              background: linear-gradient(180deg, #1c120b, #2b1a0e); box-shadow: inset 0 2px 10px rgba(0,0,0,.7); opacity: 0; visibility: hidden; }\n  .prospekt.widac { opacity: 1; visibility: visible; }\n  .prospekt svg { display: block; width: 100%; height: 100%; }\n  /* POWITANIE: po otwarciu strony prospekt z napisem przenika z ciemności (4 s); klik — pełny ekran i organy */\n  .powitanie { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 7vw;\n               background: radial-gradient(ellipse at 50% 0%, #2a2238, #0d0b14 70%); cursor: pointer; transition: opacity 1.5s ease; }\n  .powitanie.znika { opacity: 0; pointer-events: none; }\n  .powLewa { display: flex; flex-direction: column; align-items: center; gap: 2vh; }\n  /* przyciski po prawej: pojawiają się razem z prospektem; klik w przycisk nie wchodzi do organów */\n  .powPrawa { display: flex; flex-direction: column; gap: 14px; width: 300px; opacity: 0; animation: powPojaw 4s ease forwards; cursor: default; }\n  .powBtn { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 18px; border-radius: 14px; cursor: pointer;\n            font: 600 17px 'Outfit', sans-serif; color: #f3ead6; background: rgba(255,255,255,.05); border: 1px solid rgba(216,180,106,.45); transition: background .2s; }\n  .powBtn:hover { background: rgba(216,180,106,.15); }\n  .powBtn i { font-style: normal; font-size: 24px; width: 30px; text-align: center; }\n  .powBtn small { display: block; font: 400 13px 'Outfit', sans-serif; color: #b59f78; margin-top: 2px; }\n  .powBtn.glowny { background: linear-gradient(180deg, #f0d79a, #c9a35a); color: #2a1608; border-color: transparent; }\n  .powBtn.glowny:hover { filter: brightness(1.08); }\n  .powBtn.glowny small { color: #5a3c1c; }\n  .powBtn .wkrotce { color: #f0d79a; font-weight: 600; }\n  .powBtn.glowny .wkrotce { color: #7a1f14; }\n  @media (max-width: 900px) { .powitanie { flex-direction: column; gap: 3vh; } .powPrawa { width: min(320px, 90vw); } .powitanie svg { height: min(42vh, 80vw); } }\n  .powitanie .powTresc { display: flex; flex-direction: column; align-items: center; gap: 2vh; opacity: 0; animation: powPojaw 4s ease forwards; }\n  .powitanie svg { display: block; height: min(62vh, 80vw); width: auto; aspect-ratio: 452 / 410; }\n  .powitanie h1 { margin: 0; font: 700 clamp(28px, 6vh, 64px) 'Cinzel', serif; letter-spacing: .12em; color: var(--zloto); text-shadow: 0 0 24px rgba(216,180,106,.35); }\n  .powitanie .powKliknij { font-size: clamp(13px, 2vh, 18px); letter-spacing: .25em; text-transform: uppercase; color: #b59f78; opacity: 0; animation: powMruga 2.4s ease-in-out 4s infinite; }\n  @keyframes powPojaw { to { opacity: 1; } }\n  @keyframes powMruga { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }\n  /* ⛶ powrót do pełnego ekranu: pokazuje się, gdy organy z niego wyjdą (okno wyboru pliku, Esc) */\n  .wrocPelny { position: fixed; top: 12px; right: 12px; z-index: 60; font: 600 13px 'Outfit', sans-serif; color: #2a1608; cursor: pointer;\n               background: linear-gradient(180deg, #f0d79a, #c9a35a); border: 0; border-radius: 999px; padding: 8px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }\n  .wrocPelny:hover { filter: brightness(1.08); }\n  @keyframes zwracaUwage { 50% { bo sPola\" id=\"wpisPola\" hidden>\n            <label>Tytuł śpiewnika<input id=\"wpisSpiewnik\" maxlength=\"80\" placeholder=\"np. Śpiewnik parafialny\"><\/label>\n            <label>Tytuł pieśni<input id=\"wpisTytul\" maxlength=\"120\" placeholder=\"np. Kiedy ranne wstają zorze\"><\/label>\n            <label>Kategoria<input id=\"wpisKat\" list=\"kategorie\" maxlength=\"60\" placeholder=\"wybierz albo wpisz nową\"><\/label>\n            <datalist id=\"kategorie\"><\/datalist>\n            <button class=\"sfBtn\" id=\"wpisZapisz\">💾 Zapisz do kategorii<\/button>\n            <button class=\"sfBtn cichy\" id=\"wpisNowa\">✚ Nowa pieśń<\/button>\n            <button class=\"sfBtn cichy\" id=\"wpisEksport\" title=\"Pobierz cały śpiewnik jako plik .json\">📥 Zapisz śpiewnik<\/button>\n          <\/div>\n        <\/div>\n        <h3>Bank brzmień<\/h3>\n        <div class=\"opisRej opisBanku\" id=\"opisBanku\"><\/div>\n        <div class=\"mojeKol\" id=\"mojeKol\" hidden>\n          <button class=\"sfBtn\" id=\"mojeOtworz\">📂 Otwórz zestaw<\/button>\n          <button class=\"sfBtn cichy\" id=\"mojeOstatni\" hidden>↺ Ostatni<\/button>\n          <button class=\"sfBtn cichy\" id=\"mojeEdytor\">🛠 Edytor zestawu<\/button>\n        <\/div>\n        <div id=\"sfPusty\" class=\"sfKol\" hidden>\n          <div class=\"opisRej\"><b>Bank zewnętrzny<\/b><br>Twój plik SoundFont (.sf2 / .sf3).<br>Jego brzmienia staną się rejestrami.<\/div>\n          <button class=\"sfBtn\" id=\"sfUzyj\">📂 Użyj SoundFontu<\/button>\n          <button class=\"sfBtn cichy\" id=\"sfSzukaj\">🔎 Znajdź darmowe<\/button>\n          <div class=\"opisRej maly\">albo przeciągnij plik na stół gry<\/div>\n        <\/div>\n        <div id=\"sfPelny\" class=\"sfKol\" hidden>\n          <div class=\"sfNazwa\" id=\"sfNazwa\"><\/div>\n          <button class=\"sfBtn cichy\" id=\"sfInny\">📂 Inny plik<\/button>\n          <button class=\"sfBtn cichy\" id=\"sfZamknij\">✕ Odłóż plik<\/button>\n        <\/div>\n        <input type=\"file\" id=\"sfPlik\" accept=\".sf2,.sf3\" hidden>\n      <\/div>\n    <\/div>\n\n    <div class=\"utwory\">\n      <div class=\"warstwaPulpitu\" id=\"pulpitPasek\">\n        <div class=\"tryby\"><button class=\"tryb czyt wybrany\" data-tryb=\"czyt\">📖 Czytanie<\/button><button class=\"tryb wpis\" data-tryb=\"wpis\">✍️ Wpisywanie<\/button><\/div>\n        <div class=\"pliki\">\n          <button class=\"plikBtn\" id=\"wczytajSp\" title=\"Wczytaj śpiewnik z pliku .json (zastępuje obecny)\">📂 Wczytaj śpiewnik<\/button>\n          <button class=\"plikBtn\" id=\"wczytajUl\" title=\"Wczytaj ulubione z pliku .json\">⭐ Wczytaj ulubione<\/button>\n          <button class=\"plikBtn\" id=\"zapiszUl\" title=\"Zapisz ulubione do pliku .json\">💾 Zapisz ulubione<\/button>\n          <input type=\"file\" id=\"wczytajSpPlik\" accept=\".json,application/json\" hidden>\n          <input type=\"file\" id=\"wczytajUlPlik\" accept=\".json,application/json\" hidden>\n        <\/div>\n        <button class=\"edycjaBtn\" id=\"edycjaBtn\" title=\"Nagraj melodię do tej pieśni (przyciski odtwarzacza przechodzą tutaj)\">🎹 Edycja MIDI<\/button>\n        <div class=\"edycjaMidi\" id=\"edycjaMidi\"><\/div>\n        <div class=\"ulubione\" id=\"ulubione\">\n          <div class=\"ulNapis\">Przeciągnij pieśni do ulubionych<\/div>\n          <div class=\"ulSloty\" id=\"ulSloty\"><\/div>\n        <\/div>\n      <\/div>\n      <select id=\"utLista\" title=\"Wbudowane utwory\"><\/select>\n      <button id=\"utWczytaj\" title=\"Wczytaj plik .mid z dysku\">🎵 Wczytaj MIDI<\/button>\n      <button id=\"utGraj\" class=\"okr\" title=\"Graj / pauza\">▶<\/button>\n      <button id=\"utStop\" class=\"okr\" title=\"Stop\">⏹<\/button>\n      <div class=\"ut-srodek\">\n        <div class=\"ut-gora\"><span id=\"utTytul\">brak utworu — wybierz z listy albo wczytaj MIDI<\/span><span id=\"utCzas\">0:00 / 0:00<\/span><\/div>\n        <div class=\"ut-postep\" id=\"utPostep\" title=\"Kliknij, żeby przewinąć\"><i id=\"utPasek\"><\/i><\/div>\n        <div class=\"ut-slowa\" id=\"utSlowa\"><\/div>\n      <\/div>\n      <div class=\"ut-prawa\">\n      <label class=\"ut-tempo\">Tempo <input type=\"range\" id=\"tempo\" min=\"50\" max=\"150\" value=\"100\"><b id=\"tempoNap\">100%<\/b><\/label>\n      <button id=\"nagraj\" title=\"Nagraj to, co grasz\">🔴 Nagraj<\/button>\n      <span id=\"nagrPliki\" hidden><button id=\"nagrOdsluchaj\" title=\"Odsłuchaj nagranie\">▶ Odsłuchaj<\/button><button id=\"nagrMidi\">💾 MIDI<\/button><button id=\"nagrWav\">💾 WAV<\/button><\/span>\n      <\/div>\n      <input type=\"file\" id=\"midiPlik\" accept=\".mid,.midi,.kar\" hidden>\n    <\/div>\n    <div class=\"manual\"><div class=\"klawisze\" id=\"klawisze\"><\/div><\/div>\n    <div class=\"pomoc\">Graj myszką albo klawiaturą komputera: dolny rząd <b>Z S X D C V G B H N J M ,<\/b> (od c) · górny rząd <b>Q 2 W 3 E R 5 T 6 Y 7 U I<\/b> (od c¹) · rejestry: <b>Shift + 1…9, 0, -, =<\/b><\/div>\n  <\/div>\n<\/div>\n\n\n<!-- ===== EDYTOR ZESTAWU (Moje sample): okno nad organami ===== -->\n<div class=\"ez-tlo\" id=\"ez-tlo\" hidden><div class=\"ez-okno\">\n  <div class=\"ez-glowa\"><h2>Edytor zestawu<\/h2><span>3 do 6 rejestrów z Twoich nagrań · klawiatura 5 oktaw (C – c⁴)<\/span><button class=\"ez-glowny\" id=\"ez-zamknij\">✔ Gotowe — wróć do organów<\/button><\/div>\n  <div class=\"ez-panel ez-rzad\">\n    <label class=\"ez-etyk\" for=\"ez-nazwaZestawu\">Nazwa zestawu<\/label>\n    <input type=\"text\" id=\"ez-nazwaZestawu\" placeholder=\"np. Lędziny — moje rejestry\" maxlength=\"80\">\n    <span class=\"ez-odst\"><\/span>\n    <button id=\"ez-nowy\">✨ Nowy zestaw<\/button>\n    <button id=\"ez-otworz\">📂 Otwórz zestaw<\/button>\n    <button id=\"ez-ostatni\" hidden>↺ Otwórz ostatni<\/button>\n    <button id=\"ez-zapisz\" class=\"ez-glowny\">💾 Zapisz zestaw<\/button>\n  <\/div>\n  <div>\n    <div class=\"ez-zakladki\" id=\"ez-zakladki\"><\/div>\n    <div class=\"ez-panel\" style=\"border-radius: 0 10px 10px 10px\">\n      <div class=\"ez-rzad\" style=\"margin-bottom: 12px\">\n        <label class=\"ez-etyk\" for=\"ez-nazwaRej\">Nazwa rejestru<\/label>\n        <input type=\"text\" id=\"ez-nazwaRej\" placeholder=\"np. Principal 8'\" maxlength=\"40\">\n        <span class=\"ez-odst\"><\/span>\n        <button id=\"ez-dodajPliki\">➕ Dodaj nagrania…<\/button>\n        <label class=\"ez-etyk\" title=\"Puste klawisze grają najbliższe nagranie, przestrojone\"><input type=\"checkbox\" id=\"ez-uzup\"> uzupełniaj puste klawisze sąsiadem<\/label>\n        <label class=\"ez-etyk\" title=\"Każdy klawisz lekko i losowo rozstrojony (najwyżej ±1,5 centa) — jak piszczałki w prawdziwych organach. Nagrania się nie zmieniają.\"><input type=\"checkbox\" id=\"ez-zywe\"> żywe rozstrojenie<\/label>\n        <button id=\"ez-wyczysc\">🗑 Wyczyść rejestr<\/button>\n      <\/div>\n      <div class=\"ez-ramka\" id=\"ez-ramka\">\n        <div class=\"ez-klaw\" id=\"ez-klaw\"><\/div>\n        <div class=\"ez-podpis\" id=\"ez-podpis\"><\/div>\n      <\/div>\n      <div class=\"ez-stroik\" id=\"ez-stroik\" title=\"Rozstrojenie granych klawiszy (żywe rozstrojenie) — jak na stroiku\">\n        <div class=\"ez-skala\"><span class=\"ez-srodek\"><\/span><div id=\"ez-znaczki\"><\/div><span class=\"ez-wskazowka\" id=\"ez-wskazowka\"><\/span><\/div>\n        <div class=\"ez-skalaOpis\"><span>−2 centy · niżej<\/span><span>0<\/span><span>wyżej · +2 centy<\/span><\/div>\n        <div class=\"ez-stroikNapis\" id=\"ez-stroikNapis\">Zagraj klawisz (myszką, klawiaturą komputera albo MIDI) — zobaczysz jego rozstrojenie.<\/div>\n      <\/div>\n      <div class=\"ez-legenda\">\n        <span><i style=\"background: linear-gradient(#f6e2a8, #d8b46a)\"><\/i>własne nagranie<\/span>\n        <span><i style=\"background: linear-gradient(#a08559, #7d6640)\"><\/i>pożyczone od sąsiada (przestrojone)<\/span>\n        <span><i style=\"background: #2a2622\"><\/i>pusto<\/span>\n        <span>· kliknij klawisz: posłuchaj · Shift + klik: usuń nagranie z klawisza · upuść jeden plik na klawisz: tylko na ten klawisz<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"ez-dol\">\n    <div class=\"ez-panel ez-info\">\n      <h3>Klawisz<\/h3>\n      <dl id=\"ez-opisKlawisza\"><dt>—<\/dt><dd>kliknij klawisz<\/dd><\/dl>\n      <canvas class=\"ez-fala\" id=\"ez-fala\" width=\"1000\" height=\"180\"><\/canvas>\n      <div class=\"ez-rzad ez-petle\"><button id=\"ez-petla\" title=\"Sam znajduje dobre miejsce na pętlę w tym nagraniu i robi płynne przejście\">🔁 Zrób pętlę<\/button><button id=\"ez-petleRej\" title=\"To samo dla wszystkich nagrań tego rejestru (zastępuje ich pętle)\">🔁 Pętle w całym rejestrze<\/button><button id=\"ez-oryginal\" title=\"Przywróć nagranie sprzed zrobienia pętli\" hidden>↶ Oryginał<\/button><\/div>\n    <\/div>\n    <div class=\"ez-panel ez-info\">\n      <h3>Co się dzieje<\/h3>\n      <div class=\"ez-kom\" id=\"ez-komunikat\">Przeciągnij nagrania WAV z folderu na klawiaturę. Możesz wszystkie naraz.<\/div>\n      <div class=\"ez-postep\" id=\"ez-postep\"><i><\/i><\/div>\n      <div class=\"ez-pyt\" id=\"ez-pytanie\"><\/div>\n      <p class=\"ez-uwaga\">💾 Zapisz: podajesz nazwę zestawu i format — powstaje <b>jeden plik<\/b>, np. <b>Lędziny.organy<\/b>, a w nim opis i wszystkie nagrania.<br>\n        <b>Bez strat (WAV)<\/b> — dokładnie Twoje nagrania. <b>Mniejszy (Opus)<\/b> — kilka razy mniejszy plik; po otwarciu posłuchaj, czy pętle grają czysto.<br>\n        📂 Otwórz: klikasz ten jeden plik i gotowe. Nagrania zostają na Twoim komputerze.<\/p>\n    <\/div>\n  <\/div>\n<\/div><\/div>\n<input type=\"file\" id=\"ez-plikiInput\" accept=\".wav,audio/wav\" multiple hidden>\n<input type=\"file\" id=\"ez-otworzPliki\" accept=\".organy,.json,.wav,application/json,audio/wav\" multiple hidden>\n<button class=\"wrocPelny\" id=\"wrocPelny\" hidden title=\"Wróć do pełnego ekranu\">⛶ Pełny ekran<\/button>\n<div class=\"powitanie\" id=\"powitanie\">\n  <div class=\"powLewa\">\n    <div class=\"powTresc\"><svg class=\"rysProspekt\" viewBox=\"0 0 452 410\"><\/svg><h1>Organy Alicji<\/h1><\/div>\n    <div class=\"powKliknij\">kliknij, aby wejść<\/div>\n  <\/div>\n  <div class=\"powPrawa\">\n    <button class=\"powBtn glowny\" data-link=\"demo\"><i>▶<\/i><span>Zobacz demo<small>organy zagrają i pokażą, co potrafią<\/small><\/span><\/button>\n    <button class=\"powBtn\" data-link=\"edytor\"><i>🎵<\/i><span>Edytor MIDI → PNG<small>z pliku .mid robisz nuty do śpiewnika<\/small><\/span><\/button>\n    <button class=\"powBtn\" data-link=\"sample\"><i>⬇<\/i><span>Pobierz sample Alicji<small>gotowy zestaw .organy do banku „Moje sample”<\/small><\/span><\/button>\n  <\/div>\n<\/div>\n<div class=\"pelny\" id=\"pelny\" hidden>\n  <div class=\"pelnyTytul\" id=\"pelnyTytul\"><\/div>\n  <div class=\"pelnyStrona\" id=\"pelnyStrona\"><\/div>\n  <div class=\"pelnyDol\"><button id=\"pelnyLewo\" title=\"Poprzednia strona (←)\">◀<\/button><span id=\"pelnyIle\"><\/span><button id=\"pelnyPrawo\" title=\"Następna strona (→)\">▶<\/button>\n    <button id=\"pelnyZamknij\" title=\"Zamknij (Esc)\">✕<\/button><\/div>\n<\/div>\n<script>\n/* =====================================================================\n   ORGANY KOŚCIELNE — stół gry z jednym rejestrem: Pryncypał 8'\n   Dźwięk liczony na żywo w przeglądarce (Web Audio), bez nagrań.\n   ===================================================================== */\n\n// ===== REJESTRY: każdy gra z jednego z trzech nagranych rzędów piszczałek =====\n// rząd A = Pryncypał, B = Gedakt (zakryte piszczałki), C = Mixtura. Próbki MP3 leżą na końcu tego pliku.\n// glosnosc: głośność rejestru; alicja: dodatkowe wyrównanie, żeby w banku „Głosy Alicji” grał tak samo głośno jak z próbek\n// przes: o ile półtonów wyżej gra rejestr (Oktawa 4' to rząd A o oktawę wyżej — „transmisja”, jak w prawdziwych organach)\nconst REJESTRY = [\n  { id: 'bourdon',     nazwa: 'Bourdon',     stopy: \"16'\",  rzad: 'B', przes: -12, glosnosc: 0.63, alicja: 0.82,\n    opis: \"Fletowe piszczałki oktawę niżej.<br>Głęboki, miękki fundament —<br>pod spodem wszystkiego.\" },\n  { id: 'pryncypal',   nazwa: 'Pryncypał',   stopy: \"8'\",   rzad: 'A', przes: 0,   glosnosc: 1.16, alicja: 0.74,\n    opis: \"Podstawowy głos organów.<br>8' to wysokość, którą grasz.<br>Wielkie C ma piszczałkę ok. 2,4&nbsp;m.\" },\n  { id: 'gedakt',      nazwa: 'Gedakt',      stopy: \"8'\",   rzad: 'B', przes: 0,   glosnosc: 0.60, alicja: 0.82,\n    opis: \"Flet zakryty: prawie czysty ton,<br>„chiff” na wejściu i cichy oddech.<br>Okrągły, spokojny.\" },\n  { id: 'salicjonal',  nazwa: 'Salicjonał',  stopy: \"8'\",   rzad: 'D', przes: 0,   glosnosc: 0.66, alicja: 1.09,\n    opis: \"Wąskie piszczałki: dużo alikwotów,<br>cienki, „smyczkowy” ton.<br>Pięknie z Gedaktem.\" },\n  { id: 'oktawa',      nazwa: 'Oktawa',      stopy: \"4'\",   rzad: 'A', przes: 12,  glosnosc: 0.79, alicja: 0.73,\n    opis: \"Pryncypał grany oktawę wyżej —<br>to <b>transmisja<\/b>: te same piszczałki,<br>oszczędność miejsca.\" },\n  { id: 'flet4',       nazwa: 'Flet',        stopy: \"4'\",   rzad: 'B', przes: 12,  glosnosc: 0.46, alicja: 0.83,\n    opis: \"Flet oktawę wyżej.<br>Jasny, śpiewny, z „chiffem”.<br>Z Gedaktem 8' — klasyka.\" },\n  { id: 'kwinta',      nazwa: 'Kwinta',      stopy: \"2⅔'\",  rzad: 'A', przes: 19,  glosnosc: 0.44, alicja: 0.83,\n    opis: \"Gra kwintę nad oktawą.<br>Sama brzmi dziwnie — z innymi<br>dodaje barwy i „metalu”.\" },\n  { id: 'superoktawa', nazwa: 'Superoktawa', stopy: \"2'\",   rzad: 'A', przes: 24,  glosnosc: 0.59, alicja: 0.75,\n    opis: \"Pryncypał dwie oktawy wyżej.<br>Blask i przejrzystość.<br>Najwyższe nuty wracają oktawę niżej.\" },\n  { id: 'mixtura',     nazwa: 'Mixtura',     stopy: 'III',  rzad: 'C', przes: 0,   glosnosc: 0.61, alicja: 1.08,\n    opis: \"Trzy wysokie rzędy naraz (2', 1⅓', 1').<br>Korona pełnych organów —<br>z Pryncypałem i Oktawą.\" },\n  { id: 'trabka',      nazwa: 'Trąbka',      stopy: \"8'\",   rzad: 'E', przes: 0,   glosnosc: 1.29, alicja: 1.30,\n    opis: \"Rejestr języczkowy: drga metalowy<br>języczek, nie słup powietrza.<br>Ostry, uroczysty.\" },\n  { id: 'oboj',        nazwa: 'Obój',        stopy: \"8'\",   rzad: 'F', przes: 0,   glosnosc: 0.87, alicja: 1.17,\n    opis: \"Języczkowy, węższy i nosowy.<br>Solowa melodia na tle<br>cichego Gedaktu.\" },\n  { id: 'subbas',      nazwa: 'Subbas',      stopy: \"16'\",  rzad: 'B', przes: -12, glosnosc: 0.67, alicja: 0.83, doNuty: 54,\n    opis: \"Bas jak z pedału: gra tylko<br>w dolnej części klawiatury<br>(do fis). Podpiera całość.\" }\n];\n// zakres nagrań każdego rzędu: za wysokie albo za niskie nuty wracają o oktawę (tak robią prawdziwe organy — „repetycja”)\nconst ZAKRES_RZEDU = { A: [36, 108], B: [24, 108], C: [36, 96], D: [36, 96], E: [36, 96], F: [36, 96] };\nfunction celNuta(R, n) {\n  let c = n + R.przes; const [od, doN] = ZAKRES_RZEDU[R.rzad];\n  while (c > doN + 1) c -= 12; while (c < od - 1) c += 12; return c;\n}\nconst STROJ_WIATR = 0.9;              // o ile centów faluje dźwięk od „wiatru” z miechów (0 = wcale)\n\n// ===== dźwięk: wspólne części =====\nlet audio = null, wyjscieGl, kompresor, ogranicznik, sucho, mokro, poglos;\nconst hz = n => 440 * Math.pow(2, (n - 69) / 12);          // numer nuty MIDI → częstotliwość\n\nfunction startAudio() {\n  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }\n  audio = new (window.AudioContext || window.webkitAudioContext)();\n  kompresor = audio.createDynamicsCompressor();             // pilnuje, żeby akordy nie przesterowały\n  kompresor.threshold.value = -14; kompresor.ratio.value = 4;\n  wyjscieGl = audio.createGain(); wyjscieGl.gain.value = glosnosc();\n  // ogranicznik na samym końcu: nawet pełne organy z akordem nie przekroczą granicy (nie będzie trzasków)\n  ogranicznik = audio.createDynamicsCompressor();\n  ogranicznik.threshold.value = -4; ogranicznik.knee.value = 0; ogranicznik.ratio.value = 20; ogranicznik.attack.value = 0.001; ogranicznik.release.value = 0.15;\n  kompresor.connect(wyjscieGl).connect(ogranicznik).connect(audio.destination);\n  sucho = audio.createGain(); mokro = audio.createGain();   // dźwięk prosto z piszczałki i odbity od ścian\n  poglos = audio.createConvolver();\n  sucho.connect(kompresor); mokro.connect(poglos).connect(kompresor);\n  ustawPoglos();\n}\n\n// pogłos kościoła: wyliczone „echo wnętrza” — szum, który powoli cichnie i ciemnieje\nfunction ustawPoglos() {\n  if (!audio) return;\n  const p = +document.getElementById('poglos').value / 100;   // 0 = kaplica, 1 = katedra\n  const sekundy = 1.2 + p * 5.3, sr = audio.sampleRate, dl = Math.floor(sr * sekundy);\n  const imp = audio.createBuffer(2, dl, sr);\n  for (let k = 0; k < 2; k++) {\n    const d = imp.getChannelData(k); let ciemny = 0;\n    for (let i = 0; i < dl; i++) {\n      const t = i / sr, gasnie = Math.pow(1 - i / dl, 2.2) * Math.exp(-t * 1.1);\n      const jasnosc = Math.max(0.04, 0.55 * Math.exp(-t * 0.9));              // im później, tym ciemniej\n      ciemny += ((Math.random() * 2 - 1) - ciemny) * jasnosc;\n      d[i] = t < 0.018 ? 0 : ciemny * gasnie;                                   // 18 ms ciszy: dźwięk leci do ściany\n    }\n  }\n  poglos.buffer = imp;\n  // fajeczka „pogłos” odznaczona: bez pogłosu, sam czysty dźwięk (jak w edytorze zestawu), suwak przyciemniony\n  const wl = document.getElementById('poglosWl').checked;\n  document.getElementById('poglos').disabled = !wl; document.getElementById('poglosEtyk').classList.toggle('wylaczony', !wl);\n  sucho.gain.value = wl ? 0.85 - p * 0.35 : 1;\n  mokro.gain.value = wl ? 0.9 + p * 1.6 : 0;\n}\nconst glosnosc = () => +document.getElementById('glosnosc').value / 100 * 0.9;\n\n// ===== MOJE SAMPLE: nagrania z Twojego zestawu (edytor zestawu) — wczytywane dopiero przy wyciągnięciu gałki =====\nconst MS_BUF = new Map(), MS_GOT = new Map();            // plik → obietnica bufora / gotowy bufor\nfunction msBufor(w) {\n  startAudio();\n  if (!MS_BUF.has(w.plik)) MS_BUF  (f) await uzyjPliku(await f.arrayBuffer(), f.name); plikInput.value = ''; };\ndocument.getElementById('sfSzukaj').onclick = () => window.open('https://www.polyphone.io/en/soundfonts/organs', '_blank', 'noopener');\ndocument.getElementById('sfZamknij').onclick = () => {\n  for (const n in grajace) pusc(+n);\n  SF = null; sfWlaczone.clear(); rysujRejestrySF(); usunPamiec(); ustawBank('alicja').then(() => status('Plik odłożony. Wracam do banku 📜 Głosy Alicji.'));\n};\naddEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('upusc'); });\naddEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('upusc'); });\naddEventListener('drop', async e => {\n  e.preventDefault(); document.body.classList.remove('upusc');\n  const f = [...(e.dataTransfer.files || [])][0]; if (!f) return;\n  if (/\\.(mid|midi|kar)$/i.test(f.name)) { await wczytajMidi(await f.arrayBuffer(), f.name); return; }\n  if (!/\\.sf[23]$/i.test(f.name)) { status('✖ Przeciągnij plik SoundFont (.sf2 / .sf3) albo MIDI (.mid).'); return; }\n  await uzyjPliku(await f.arrayBuffer(), f.name);\n});\n\n// ===== pamięć: ostatni SoundFont zostaje w przeglądarce (IndexedDB) =====\nfunction baza() { return new Promise((ok, zle) => { const r = indexedDB.open('organy-alicji-demo', 3); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('sf')) d.createObjectStore('sf'); if (!d.objectStoreNames.contains('piesni')) d.createObjectStore('piesni', { keyPath: 'id', autoIncrement: true }); if (!d.objectStoreNames.contains('ustawienia')) d.createObjectStore('ustawienia'); }; r.onsuccess = () => ok(r.result); r.onerror = () => zle(r.error); }); }\nasync function bazaZrob(tryb, f, sklep = 'sf') { try { const db = await baza(); return await new Promise((ok, zle) => { const tx = db.transaction(sklep, tryb), w = f(tx.objectStore(sklep)); tx.oncomplete = () => ok(w && w.result); tx.onerror = () => zle(tx.error); }); } catch (e) { return null; } }\nconst zapiszPamiec = (dane, nazwa) => bazaZrob('readwrite', s => s.put({ dane, nazwa, wlaczone: [...sfWlaczone] }, 'ostatni'));\nlet czasWyboru = 0;\nfunction zapiszWybor() { if (!SF) return; clearTimeout(czasWyboru); czasWyboru = setTimeout(() => bazaZrob('readwrite', s => { const r = s.get('ostatni'); r.onsuccess = () => { if (r.result) { r.result.wlaczone = [...sfWlaczone]; r.result.org = [...orgWlaczone]; s.put(r.result, 'ostatni'); } }; }), 300); }\nconst usunPamiec = () => bazaZrob('readwrite', s => s.delete('ostatni'));\n(async () => { const z = await bazaZrob('readonly', s => s.get('ostatni')); if (z && z.dane) { await uzyjPliku(z.dane, z.nazwa, z); if (bank !== 'sf') status('Bank: <b>' + BANKI[bank].nazwa + '<\/b> · w zapasie plik ' + esc(z.nazwa)); else status(document.getElementById('status').innerHTML + '<br>(zapamiętany z poprzedniego razu)'); } })();\n\n\n// ===== klawiatura na ekranie: c (C3) do c³ (C6) =====\nconst OD = 48, DO = 84;\nconst KOMPUTER = { KeyZ: 48, KeyS: 49, KeyX: 50, KeyD: 51, KeyC: 52, KeyV: 53, KeyG: 54, KeyB: 55, KeyH: 56, KeyN: 57, KeyJ: 58, KeyM: 59, Comma: 60,\n                   KeyQ: 60, Digit2: 61, KeyW: 62, Digit3: 63, KeyE: 64, KeyR: 65, Digit5: 66, KeyT: 67, Digit6: 68, KeyY: 69, Digit7: 70, KeyU: 71, KeyI: 72 };\nconst LITERA = {}; for (const [k, n] of Object.entries(KOMPUTER)) if (k !== 'Comma') LITERA[n] = k.replace(/^Key|^Digit/, '');\n(function rysujKlawisze() {\n  const czarne = [1, 3, 6, 8, 10], el = document.getElementById('klawisze');\n  const biale = []; for (let n = OD; n <= DO; n++) if (!czarne.includes(n % 12)) biale.push(n);\n  let h = '';\n  biale.forEach(n => h += `<div class=\"bialy\" data-n=\"${n}\">${n % 12 === 0 ? `<span class=\"c\">${nazwaPolska(n)}<\/span>` : ''}<small>${LITERA[n] || ''}<\/small><\/div>`);\n  const szer = 100 / biale.length;\n  for (let n = OD; n <= DO; n++) if (czarne.includes(n % 12)) {\n    const ileBialychPrzed = biale.filter(b => b < n).length;\n    h += `<div class=\"czarny\" data-n=\"${n}\" style=\"left:calc(${ileBialychPrzed * szer}% - ${szer * 0.31}%);width:${szer * 0.62}%\"><small>${LITERA[n] || ''}<\/small><\/div>`;\n  }\n  el.innerHTML = h;\n  // myszka: można przeciągać po klawiszach jak glissando\n  let mysz = false;\n  el.addEventListener('pointerdown', e => { const k = e.target.closest('[data-n]'); if (!k) return; mysz = true; e.preventDefault(); wcisnij(+k.dataset.n); el.setPointerCapture(e.pointerId); });\n  el.addEventListener('pointermove', e => {\n    if (!mysz) return; const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-n]'), n = k ? +k.dataset.n : -1;\n    for (const g in grajace) if (+g !== n && !wcisnieteKlawiszem.has(+g)) pusc(+g);\n    if (n >= 0) wcisnij(n);\n  });\n  const koniec = () => { mysz = false; for (const g in grajace) if (!wcisnieteKlawiszem.has(+g) && !midiTrzyma.has(+g)) pusc(+g); };\n  el.addEventListener('pointerup', koniec); el.addEventListener('pointercancel', koniec);\n})();\nconst wcisnieteKlawiszem = new Set(), midiTrzyma = new Set();\n// piszesz w polu tekstowym → klawisze nie grają i nie przełączają rejestrów\nconst piszeTekst = e => ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable;\naddEventListener('keydown', e => {\n  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || piszeTekst(e)) return;\n  const n = KOMPUTER[e.code]; if (n == null) return; e.preventDefault();\n  if (EZ.otwarty()) { EZ.wcisnij(n); return; }               // sampler otwarty: grasz w samplerze\n  wcisnieteKlawiszem.add(n); wcisnij(n, 'kl');\n});\naddEventListener('keyup', e => { const n = KOMPUTER[e.code]; if (n == null) return; EZ.pusc(n); wcisnieteKlawiszem.delete(n); pusc(n, 'kl'); });\naddEventListener('blur', () => { for (const g in zrodla) { pusc(+g, 'kl'); pusc(+g, 'mysz'); } wcisnieteKlawiszem.clear(); });\n\ndocument.getElementById('poglos').oninput = ustawPoglos;\ndocument.getElementById('poglosWl').onchange = ustawPoglos;\ndocument.getEleme // gdy otwarty jest edytor zestawu (wyższy niż ekran), dymek stoi na dole sceny, a edytor przewija się tak, żeby wskazane miejsce było nad dymkiem
const edytorOtwarty = () => { const t = wOrganach('#ez-tlo'); return t && !t.hidden; };
function naKlawisze(){ const t = $('#talk');
  t.classList.toggle('stol', !edytorOtwarty());
  if (edytorOtwarty()){ const o = wOrganach('.ez-okno').getBoundingClientRect();
    Object.assign(t.style, { left: o.left + 'px', top: '628px', width: o.width + 'px', height: '164px', bottom: 'auto' }); return; }
  const el = wOrganach('.klawisze'); if (!el) return; const r = el.getBoundingClientRect(); if (!r.width) return;
  Object.assign(t.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', bottom: 'auto' }); }
function pokazWEdytorze(sel){ if (!edytorOtwarty()) return; const el = wOrganach(sel); if (!el) return; const r = el.getBoundingClientRect();
  if (r.top < 10 || r.bottom > 620) wOrganach('#ez-tlo').scrollBy({ top: (r.top + r.bottom) / 2 - 300, behavior: 'smooth' }); }
function zgas(o){ if (!o) return; o.n.classList.remove('on'); wsk = wsk.filter(x => x !== o); setTimeout(() => o.n.remove(), 700); }
function zgasWszystko(){ [...wsk].forEach(zgas); }

/* ----- demo pisze w polu organów, literka po literce (organy dostają zwykłe zdarzenie „input”, jak przy pisaniu z klawiatury) ----- */
async function wpisz(sel, tekst, dopisz = false){ const el = wOrganach(sel); if (!el) return; const g = gen;
  const w = org.contentWindow; if (!dopisz) el.value = '';
  for (const ch of tekst){ if (g !== gen) return; el.value += ch; el.dispatchEvent(new w.Event('input', { bubbles: true })); el.scrollTop = el.scrollHeight;
    await czekaj(ch === '\n' ? 160 : 38); }
  el.dispatchEvent(new w.Event('change', { bubbles: true })); }

const GLOS_DEMO = 'glosy/060-c.wav';
const GLOS_DEMO_WWW = 'https://miniklik.github.io/organy/glosy/060-c.wav';   // gdy demo otwarte z dysku i obok nie ma folderu glosy
// pobieranie przez blob: działa i z GitHuba, i z pliku na dysku (zwykły link z dysku kończy się „nie znaleziono pliku”)
async function zapiszGlosDemo(){ return zapiszPlikDemo([GLOS_DEMO, GLOS_DEMO_WWW], '060-c.wav'); }
// nuty pieśni zrobione w Edytorze MIDI → PNG (plik leży w repozytorium organów: obrazy/kiedy-ranne.png)
const NUTY_DEMO = 'obrazy/kiedy-ranne.png', NUTY_DEMO_WWW = 'https://miniklik.github.io/organy/obrazy/kiedy-ranne.png';
async function zapiszPlikDemo(adresy, nazwa){
  let dane = null;
  for (const adres of adresy){ try { const r = await fetch(adres); if (r.ok){ dane = await r.blob(); break; } } catch(e){} }
  if (!dane) return false;
  const a = document.createElement('a'); a.href = URL.createObjectURL(dane); a.download = nazwa;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}
function pobierzGlos(){ return new Promise(gotowe => {
  const n = document.createElement('div'); n.className = 'dm-pobierz';
  n.innerHTML = `Nie masz jeszcze swoich nagrań? Pobierz <b>głos demo</b> na próbę.
    <div class="pr"><a class="gl" href="#">⬇ Pobierz głos demo</a><button>Anuluj</button></div>`;
  root.querySelector('.dm-wierzch').appendChild(n); requestAnimationFrame(() => n.classList.add('on'));
  const zamknij = () => { n.classList.remove('on'); setTimeout(() => n.remove(), 600); };
  n.querySelector('button').onclick = () => { zamknij(); gotowe(false); };       // ktoś ma już swoje nagrania
  n.querySelector('a').onclick = async e => { e.preventDefault();
    const a = e.currentTarget; if (a.dataset.czeka) return; a.dataset.czeka = 1; a.textContent = '⏳ Pobieram…';
    if (!await zapiszGlosDemo()){ a.textContent = '⚠ Brak internetu — spróbuj jeszcze raz'; delete a.dataset.czeka; return; }
    n.innerHTML = `Przeciągnij plik <b>060-c.wav</b> z folderu Pobrane na klawiaturę.<br>Pobaw się, a potem kliknij Dalej.
      <div class="pr"><button class="gl">Dalej ›</button></div>`;
    n.querySelector('button').onclick = () => { zamknij(); gotowe(true); };
  };
}); }

  const dt = new w.DataTransfer(); dt.setData('text/plain', 'piesn:' + p.dataset.id);

/* ---------- odtwarzanie ---------- */
// Pokaz to lista kroków: „scena” (to, co się dzieje na ekranie) i „zdanie” (to, co mówi Alicja).
// ⏪ 5 s cofa do zdania, które Alicja mówiła 5 sekund temu, i mówi od niego jeszcze raz.
// To, co już się stało na ekranie (kliknięcia, wpisany tekst), nie robi się drugi raz — powtarza się tylko mowa.
const OD_CZESCI_2 = false;            // true = start od śpiewnika (przy poprawianiu drugiej części)
let zegar = 0, zegarT = performance.now(), cofka = 0, chceCofnac = false;
(function tykaj(){ const t = performance.now(); if (!pauza) zegar += t - zegarT; zegarT = t; requestAnimationFrame(tykaj); })();
async function odtworz(){
  ustawPauze(false); gen++; const g = gen;
  stop(); cisza(); W = {};
  log.innerHTML = ''; $('#koniec').classList.remove('on'); $('#koniec').innerHTML = '';
  $('#tytul').textContent = 'Organy Alicji · demo'; $('#tytul').classList.add('on');
  zbuduj($('#kam'));
  const od = OD_CZESCI_2 ? sceny.findIndex(x => x.czesc2) : 0;
  if (od > 0){ await otworzOrgany(); ustawBankAlicji(); await czekaj(1200); }
  // lista kroków
  const kroki = [];
  for (const s of sceny.slice(od)){
    const sc = { typ: 'scena', s }; kroki.push(sc);
    for (const l of s.mowa){ const [t, f] = Array.isArray(l) ? l : [l]; kroki.push({ typ: 'zdanie', t, f }); }
    kroki.push({ typ: 'koniecSceny', sc });
  }
  let i = 0;
  while (i < kroki.length){
    if (g !== gen) return;
    if (chceCofnac){ chceCofnac = false; i = cofnijDo(kroki, i); continue; }
    const k = kroki[i];
    if (k.typ === 'scena'){ if (!k.zrobione){ k.zrobione = true; k.anim = k.s.on && k.s.on(); await czekaj(400); } i++; continue; }
    if (k.typ === 'koniecSceny'){ if (!k.zrobione){ k.zrobione = true; const a = k.sc.anim; if (a && a.then) await a; } i++; continue; }
    // zdanie
    const c = cofka; k.start = zegar;
    let p = null; if (!k.zrobione){ k.zrobione = true; p = k.f && k.f(); }
    await powiedz(k.t, g);
    if (cofka !== c) continue;                                  // w trakcie zdania kliknięto ⏪ — pętla sama cofnie
    if (p && p.then) await p;
    i++;
  }
  if (g !== gen) return;
  while (log.children.length > 1) log.firstChild.remove();          // na klawiaturze mało miejsca: zostaje ostatnie zdanie i przycisk
  const k = $('#koniec');
  k.innerHTML = '<button id="znowu">↺ Obejrzę jeszcze raz</button>';
  k.classList.add('on');
  $('#znowu').onclick = odtworz;
}
// które zdanie Alicja mówiła 5 sekund temu
function cofnijDo(kroki, i){
  const cel = zegar - 5000; let j = -1;
  for (let x = 0; x < kroki.length; x++){ const k = kroki[x]; if (k.typ === 'zdanie' && k.start != null && k.start <= cel) j = x; }
  if (j < 0) j = kroki.findIndex(k => k.typ === 'zdanie' && k.start != null);   // początek pokazu
  if (j < 0) return i;
  for (let x = j; x < kroki.length; x++) if (kroki[x].typ === 'zdanie' && x > j) kroki[x].start = null;
  log.innerHTML = ''; return j;
}

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuty z MIDI</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ten sam wygląd co Organy Alicji: drewno, złoto, kremowa kartka */
  :root { --drewno1: #4a2a17; --drewno2: #2e190d; --kosc: #f3ead6; --zloto: #d8b46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 0%, #2a2238, #0d0b14 70%); color: #f3ead6; font-family: 'Outfit', system-ui, sans-serif;
         display: grid; place-items: center; padding: 24px 16px; }
  .stol { width: min(980px, 100%); padding: 22px 26px 26px; border-radius: 16px;
          background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 6%, transparent 94%, rgba(0,0,0,.25)),
                      repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 3px, transparent 3px 11px),
                      linear-gradient(180deg, var(--drewno1), var(--drewno2));
          box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.08); border: 1px solid #1a0e07; }
  body.upusc .stol { outline: 3px dashed var(--zloto); outline-offset: 6px; }
  h1 { margin: 0; text-align: center; font: 700 26px 'Cinzel', serif; letter-spacing: .12em; color: var(--zloto); }
  .pod { text-align: center; font-size: 12px; letter-spacing: .25em; color: #b59f78; text-transform: uppercase; margin: 2px 0 16px; }
  /* panel jak środkowa konsola organów */
  .konsola { border-radius: 10px; padding: 14px 18px 16px; background: linear-gradient(180deg, #1c120b, #2b1a0e); box-shadow: inset 0 2px 10px rgba(0,0,0,.7); }
  .napis { font: 700 14px 'Cinzel', serif; letter-spacing: .14em; color: var(--zloto); text-align: center; padding: 2px 0 10px; }
  /* kartka: dokładnie proporcje Strony tytułowej w organach (434 × 227) */
  .kartka { width: 100%; aspect-ratio: 434 / 227; border-radius: 8px; overflow: hidden; background: var(--kosc); border: 1px solid #3d2a18;
            box-shadow: inset 0 2px 8px rgba(0,0,0,.25); display: grid; place-items: center; user-select: none; }
  .kartka svg { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  .pusto { color: #8d7a5c; font-size: 16px; text-align: center; line-height: 1.6; padding: 20px; }
  .pasek { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
           background: linear-gradient(180deg, #1c120b, #2b1a0e); box-shadow: inset 0 2px 10px rgba(0,0,0,.7); }
  button, select, input { font: 600 13px 'Outfit', sans-serif; color: #f3ead6; border-radius: 999px; padding: 8px 12px;
           background: rgba(255,255,255,.07); border: 1px solid rgba(216,180,106,.45); }
  button { cursor: pointer; white-space: nowrap; }
  select { cursor: pointer; } select option { background: #2b1a0e; }
  input[type=number] { width: 74px; padding: 7px 10px; }
  input[type=text] { flex: 1; min-width: 160px; padding: 7px 12px; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.15); }
  button:disabled, select:disabled, input:disabled { opacity: .35; cursor: default; }
  button.zloty { background: linear-gradient(180deg, #f0d79a, #c9a35a); color: #2a1608; border-color: transparent; }
  button.zloty:hover:not(:disabled) { background: linear-gradient(180deg, #f6e2b0, #d4b06a); }
  button.gra { background: #3f7a3a; border-color: #6fbf66; }
  label { font-size: 12px; color: #b59f78; display: flex; align-items: center; gap: 6px; }
  .info { flex: 1; min-width: 200px; font-size: 13px; color: #d9c9a8; line-height: 1.45; }
  .info b { color: var(--zloto); }
  .blad { color: #ff9b8f; }
  .edycja[hidden] { display: none; }
  .strony { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: #d9c9a8; }
  .strony button { padding: 5px 12px; }
  .strony #fBtn i { font-family: Georgia, serif; margin-right: 3px; }
  .strony #fBtn.wl { background: linear-gradient(180deg, #f0d79a, #c9a35a); color: #2a1608; border-color: transparent; }
  .strony #strNr, .strony #strIle { min-width: 96px; text-align: center; }
  /* okienko z czystym taktem — stoi nad poprawianym taktem */
  .stol { position: relative; }
  .okno { position: absolute; z-index: 5; width: 410px; padding: 10px 12px 12px; border-radius: 12px; background: linear-gradient(180deg, #2b1a0e, #1c120b);
          border: 2px solid #d8b46a; box-shadow: 0 0 0 4px rgba(216,180,106,.25), 0 18px 40px rgba(0,0,0,.6); }
  .okno[hidden] { display: none; }
  .kMenu { position: absolute; z-index: 6; padding: 5px; border-radius: 999px; background: #1c120b; border: 2px solid #3fa34d; box-shadow: 0 10px 26px rgba(0,0,0,.55); }
  .kMenu[hidden] { display: none; }
  .kMenu button { background: linear-gradient(180deg, #4fb35c, #2f8a3b); border-color: transparent; color: #fff; }
  .kMenu button:hover { background: linear-gradient(180deg, #5cc46a, #379a45); }
  .oGlowa { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #d9c9a8; margin-bottom: 6px; }
  .oGlowa b { color: var(--zloto); }
  .oGlowa .oTytul { margin: 0; padding: 0; background: none; color: #d9c9a8; font-weight: 400; }
  .oGlowa span#oknoLicz { margin-left: auto; font-weight: 600; color: #ffe2a8; padding: 2px 10px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .oTryb button.usun { color: #ffb4a8; border-color: rgba(220,90,70,.6); }
  .oTryb button.usun:hover, .oTryb button.usun.pyta { background: #b8392a; color: #fff; border-color: #ff8a75; }
  .oTryb { margin: 0 0 6px; gap: 4px; } #okno .oTryb button { flex: 1 1 0; min-width: 0; font-size: 12px; padding: 4px 4px; white-space: nowrap; }
  .oGlowa span.pelno { animation: pelno .5s 2; }
  @keyframes pelno { 50% { background: #a8322a; color: #fff; } }
  .oTakt { border-radius: 8px; overflow: hidden; border: 2px solid #c27a00; box-shadow: 0 0 12px rgba(216,170,60,.45); }
  .oTakt svg { display: block; width: 100%; height: auto; }
  .oRzad { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
  .oRzad button { padding: 4px 8px; font-size: 14px; }
  .oRzad button small { font-size: 10px; color: #b59f78; }
  .oRzad button.wyb { background: rgba(216,180,106,.35); border-color: #f0d79a; }
  .oOkt { font-size: 12px; color: #d9c9a8; min-width: 90px; text-align: center; }
</style>
</head>
<body>
<div class="stol">
    <div class="kMenu" id="kMenu" hidden><button id="kBtn">↵ Koniec linijki</button></div>
    <div class="okno" id="okno" hidden>
      <div class="oGlowa"><span class="oTytul" id="oknoTytul">Takt 1 — zagraj go od nowa</span><span id="oknoLicz">zajęte 0 z 16</span></div>
      <div class="oRzad oTryb"><button data-t="przed" title="nowy takt przed tym">◀ Nowy przed</button><button data-t="podmien" title="zagraj ten takt od nowa">⟲ Podmień</button><button data-t="za" title="nowy takt za tym">Nowy za ▶</button><button id="oUsun" class="usun" title="Delete — dwa razy">🗑 Usuń takt</button></div>
      <div class="oTakt" id="oknoTakt"></div>
      <div class="oRzad">
        <button data-w="1" title="1">𝅘𝅥𝅯 <small>1</small></button><button data-w="2" title="2">♪ <small>2</small></button><button data-w="4" title="3">♩ <small>3</small></button><button data-w="8" title="4">𝅗𝅥 <small>4</small></button><button data-w="16" title="5">𝅝 <small>5</small></button>
        <button id="oKropka" title="kropka (.)">• <small>.</small></button><button id="oPauza" title="pauza (0 albo spacja)">pauza <small>0</small></button><button id="oCofnij" title="zabierz ostatnią (Backspace)">⌫</button>
      </div>
      <div class="oRzad">
        <button id="oDol" title="oktawa niżej (↓)">↓</button><span class="oOkt" id="oOkt"></span><button id="oGora" title="oktawa wyżej (↑)">↑</button>
        <span style="flex:1"></span><button id="oNie" title="Esc">✖ Anuluj</button><button class="zloty" id="oOk" title="Enter">✔ Potwierdź</button>
      </div>
    </div>
  <h1>Nuty z MIDI</h1>
  <div class="pod">Nuty do Organów Alicji</div>
  <div class="konsola">
    <div class="napis" id="napis">&nbsp;</div>
    <div class="kartka" id="kartka"><div class="pusto">Przeciągnij tutaj plik <b>.mid</b><br>albo kliknij „Wczytaj MIDI” na dole</div></div>
    <div class="strony edycja" id="strony" hidden>
      <button id="strPop" title="poprzednia strona">◀</button><span id="strNr">Strona 1 z 1</span><button id="strNast" title="następna strona">▶</button>
      <span style="flex:1"></span><button id="fBtn" title="funkcje nad nutami"><i>Am</i> Funkcje</button><span style="flex:1"></span>
      <button id="strMniej" title="mniej stron">➖</button><span id="strIle">Stron: 1</span><button id="strWiecej" title="podziel na więcej stron">➕</button>
    </div>
  </div>
  <div class="pasek">
    <button id="wczytaj">🎵 Wczytaj MIDI</button>
    <div class="info" id="info">Wczytaj plik MIDI — nuty pojawią się na pięciolinii i możesz je poprawiać.</div>
    <input type="file" id="plik" accept=".mid,.midi" hidden>
  </div>
  <div class="pasek edycja" id="edycja" hidden>
    <label>Metrum <select id="metrum"><option>2/4</option><option>3/4</option><option>4/4</option><option>6/8</option><option>3/8</option></select></label>
    <label>Tonacja <select id="tonacja"></select></label>
    <label>Tempo <input type="number" id="tempo" min="30" max="240" value="100"></label>
    <button id="graj">▶ Odsłuchaj</button>
    <button id="cofnij" title="Cofnij (Ctrl+Z)" disabled>↶ Cofnij</button>
    <button id="zapiszMidi">💾 Zapisz MIDI</button>
    <button class="zloty" id="zapisz">💾 Zapisz PNG</button>
  </div>
  <div class="pasek edycja" id="edycja2" hidden>
    <label>Podpis</label><input type="text" id="podpis" placeholder="np. mel. Roman Dwornik (widać go na kartce)" maxlength="80">
    <label>Tytuł</label><input type="text" id="tytul" placeholder="nazwa pliku" maxlength="80">
  </div>
</div>

<script>
/* =====================================================================
   NUTY Z MIDI — plik MIDI → nuty na pięciolinii, które można poprawiać, a na koniec PNG do Organów Alicji
   Klucz wiolinowy, jeden głos (najwyższy), siatka szesnastek. Dalej to jest MIDI: można je odsłuchać i zapisać.
   Nuty są trzymane jako ciąg: nuta albo pauza i jej długość w szesnastkach.
   Zmiana długości przesuwa dalsze nuty (nic nie ginie), takty układają się same.
   Kartka ma proporcje 434 × 227 (jak w organach); PNG zapisuje się 3× większy, żeby był ostry.
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const W = 434, H = 227, SKALA_PNG = 3;
let ciag = null;                 // [{ n: numer MIDI albo null (pauza), d: długość w szesnastkach }]
let ust = null;                  // { gora, dol, k (tonacja), tempo }
let zazn = -1, historia = [], linie = [], taktyGeo = [], taktWyb = -1;
let funkcje = [], trybF = false, fEd = null;   // funkcje nad nutami: [{ t: miejsce w szesnastkach, tekst }]; fEd — właśnie wpisywana
let konce = new Set(), kreski = [], kreskaMenu = -1;   // ręczne końce linijek: numery taktów, po których linijka się kończy
let stron = 1, strona = 0, uklad = { naLinie: 4, lpp: 4, ileStron: 1 };   // podział na strony: ile stron, która widoczna

// ===== czytanie pliku MIDI =====
function czytajMidi(dane) {
  const u8 = new Uint8Array(dane), dv = new DataView(dane), txt = (o, n) => String.fromCharCode(...u8.slice(o, o + n));
  if (txt(0, 4) !== 'MThd') throw new Error('To nie jest plik MIDI.');
  const dlNag = dv.getUint32(4), ileSciezek = dv.getUint16(10), tpq = dv.getUint16(12);
  if (tpq & 0x8000) throw new Error('Ten plik MIDI liczy czas w klatkach filmu (SMPTE) — tego nie obsługuję.');
  const dekoder = new TextDecoder('windows-1250');
  const wynik = { tpq, nuty: [], funkcje: [], metrum: null, metra: [], tonacja: null, tempo: null, teksty: {} };
  let o = 8 + dlNag;
  for (let s = 0; s < ileSciezek && o + 8 <= u8.length; s++) {
    if (txt(o, 4) !== 'MTrk') break;
    const koniec = o + 8 + dv.getUint32(o + 4); let p = o + 8, tick = 0, status = 0, ostatni = 0;
    const wcis = {};
    const vlq = () => { let v = 0, b; do { b = u8[p++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80 && p < koniec); return v; };
    while (p < koniec) {
      tick += vlq();
      const b = u8[p];
      if (b & 0x80) { status = b; p++; if (b < 0xf0) ostatni = b; } else if (ostatni) status = ostatni; else break;
      const typ = status & 0xf0, kanal = status & 0x0f;
      if (status === 0xff) {
        const meta = u8[p++], n = vlq(), d = u8.slice(p, p + n);
        if (meta === 0x58) { const m = { gora: d[0], dol: 2 ** d[1], tick }; wynik.metra.push(m); if (!wynik.metrum) wynik.metrum = m; }
        else if (meta === 0x59 && wynik.tonacja == null) wynik.tonacja = (d[0] << 24) >> 24;     // liczba krzyżyków (+) albo bemoli (−)
        else if (meta === 0x51 && !wynik.tempo) wynik.tempo = Math.round(60000000 / ((d[0] << 16) | (d[1] << 8) | d[2]));
        else if (meta === 0x06) { const tx = dekoder.decode(d).replace(/\0/g, '').trim(); if (tx) wynik.funkcje.push({ tick, tekst: tx }); }   // znacznik = funkcja nad nutą
        else if (meta >= 0x01 && meta <= 0x0f && !wynik.teksty[meta]) wynik.teksty[meta] = dekoder.decode(d).replace(/\0/g, '').trim();
        p += n;
      } else if (status === 0xf0 || status === 0xf7) { p += vlq(); }
      else if (typ === 0x90 || typ === 0x80) {
        const n = u8[p++], v = u8[p++];
        if (kanal === 9) continue;                                   // perkusja
        if (typ === 0x90 && v > 0) wcis[n] = tick;
        else if (wcis[n] != null) { wynik.nuty.push({ n, a: wcis[n], b: tick }); delete wcis[n]; }
      } else if (typ === 0xc0 || typ === 0xd0) p += 1;
      else p += 2;
    }
    o = koniec;
  }
  if (!wynik.nuty.length) throw new Error('W tym pliku nie ma nut.');
  return wynik;
}

// ===== MIDI → ciąg nut i pauz w szesnastkach: jeden głos (najwyższy), legato =====
function ciagZMidi(M) {
  const s16 = M.tpq / 4;
  const q = M.nuty.map(x => { const s = Math.round(x.a / s16); return { n: x.n, s, k: Math.max(s + 1, Math.round(x.b / s16)) }; })
                  .sort((a, b) => a.s - b.s || b.n - a.n);
  const jeden = [];
  for (const x of q) { if (jeden.length && jeden[jeden.length - 1].s === x.s) continue; jeden.push(x); }   // akord → najwyższy dźwięk
  const wynik = []; let t = 0;
  jeden.forEach((x, i) => {
    const nast = i + 1 < jeden.length ? jeden[i + 1].s : Infinity;
    let k = Math.min(x.k, nast);
    if (nast !== Infinity && nast - k <= 1) k = nast;              // szczelina na szesnastkę to puszczenie klawisza, nie pauza
    if (x.s > t) wynik.push({ n: null, d: x.s - t });              // pauza przed nutą (np. przedtakt)
    wynik.push({ n: x.n, d: Math.max(1, k - x.s) }); t = x.s + Math.max(1, k - x.s);
  });
  return wynik;
}

// ===== ciąg → takty: każdy znak pamięta, z którego elementu ciągu pochodzi (src) =====
const WARTOSCI = [16, 12, 8, 6, 4, 3, 2, 1];
const rozloz = (d, lista) => { const w = []; for (const v of lista) while (d >= v) { w.push(v); d -= v; } return w; };
function takty(ciag, T) {
  const suma = ciag.reduce((s, e) => s + e.d, 0), ile = Math.max(1, Math.ceil(suma / T)), tk = Array.from({ length: ile }, () => []);
  let t = 0;
  ciag.forEach((e, i) => {
    let reszta = e.d, pos = t;
    while (reszta > 0) {
      const b = Math.floor(pos / T), miejsce = (b + 1) * T - pos, ile2 = Math.min(reszta, miejsce);
      if (e.n == null && pos === b * T && ile2 === T) tk[b].push({ typ: 'p', d: T, cala: true, src: i });
      else {
        const cz = rozloz(ile2, e.n == null ? [8, 4, 2, 1] : WARTOSCI.filter(v => v <= T));
        cz.forEach((v, j) => tk[b].push(e.n == null ? { typ: 'p', d: v, src: i }
          : { typ: 'n', n: e.n, d: v, src: i, luk: j < cz.length - 1 || reszta - ile2 > 0, ciag: pos > t || j > 0 }));
      }
      pos += ile2; reszta -= ile2;
    }
    t += e.d;
  });
  const ost = ile * T - suma;                                         // dopełnienie ostatniego taktu pauzami
  if (ost > 0) rozloz(ost, [8, 4, 2, 1]).forEach(v => tk[ile - 1].push({ typ: 'p', d: v, src: -1 }));
  return tk;
}

// ===== pisownia dźwięku w tonacji =====
const LITERY = 'CDEFGAB', KRZ = ['F', 'C', 'G', 'D', 'A', 'E', 'B'], BEM = ['B', 'E', 'A', 'D', 'G', 'C', 'F'];
const POZ_KRZ = { F: 8, C: 5, G: 9, D: 6, A: 3, E: 7, B: 4 }, POZ_BEM = { B: 4, E: 7, A: 3, D: 6, G: 2, C: 5, F: 1 };
function pisownia(n, k) {
  const z = k >= 0 ? ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'] : ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const nz = z[n % 12], lit = nz[0], okt = Math.floor(n / 12) - 1;
  return { lit, okt, znak: nz[1] === '#' ? 1 : nz[1] === 'b' ? -1 : 0, poz: okt * 7 + LITERY.indexOf(lit) - (4 * 7 + 2) };   // poz 0 = e¹ (dolna linia)
}
function znakiTonacji(k) { const m = {}; LITERY.split('').forEach(l => m[l] = 0); (k > 0 ? KRZ.slice(0, k) : BEM.slice(0, -k)).forEach(l => m[l] = k > 0 ? 1 : -1); return m; }
// ===== pauzy w skali pięciolinii =====
function pauza(z, x, y0, g) {
  if (z.cala || z.d >= 16) return `<rect x="${x - g * .65}" y="${y0 + g}" width="${g * 1.3}" height="${g / 2}" stroke="none"/>`;
  if (z.d >= 8) return `<rect x="${x - g * .65}" y="${y0 + 1.5 * g}" width="${g * 1.3}" height="${g / 2}" stroke="none"/>`;
  if (z.d >= 4) return `<path d="M${x - g * .25} ${y0 + g * .55} l ${g * .55} ${g * .75} l ${-g * .55} ${g * .65} l ${g * .6} ${g * .75} q ${-g * .85} ${-g * .3} ${-g * .4} ${g * .75}" fill="none" stroke-width="${g * .26}" stroke-linejoin="round"/>`;
  const kk = yy => `<circle cx="${x - g * .1}" cy="${yy}" r="${g * .26}" stroke="none"/><path d="M${x - g * .1} ${yy + g * .1} q ${g * .4} ${g * .2} ${g * .75} ${-g * .2}" fill="none" stroke-width="${g * .15}"/>`;
  if (z.d >= 2) return kk(y0 + 1.5 * g) + `<line x1="${x + g * .65}" x2="${x + g * .1}" y1="${y0 + 1.35 * g}" y2="${y0 + 3.2 * g}" stroke-width="${g * .16}"/>`;
  return kk(y0 + 1.5 * g) + kk(y0 + 2.5 * g) + `<line x1="${x + g * .65}" x2="${x}" y1="${y0 + 1.35 * g}" y2="${y0 + 3.8 * g}" stroke-width="${g * .16}"/>`;
}

// ===== rysowanie Strony tytułowej (SVG 434 × 227); zaznaczona nuta na złoto (tylko na ekranie, nie w PNG) =====
// op: { ciag, W, H, naLinie, podpis, png (bez podświetleń), slabeDopelnienie, bezKonca }
function rysujStrone(doPng, op = {}) {
  const { gora: mGora, dol: mDol, k } = ust, glowna = !op.ciag;
  const C = op.ciag || ciag, SW = op.W || W, SH = op.H || H, podpis = op.podpis != null ? op.podpis : $('podpis').value.trim();
  const T = mGora * 16 / mDol;                                     // długość taktu w szesnastkach (4/4 → 16, 3/4 → 12, 6/8 → 12)
  const tk = takty(C, T);

async function wczytaj(f) {

    const t = M.teksty;

    const zNazwy = f.name.replace(/\.(mid|midi)$/i, '').replace(/(_\d+)+$/, '').replace(/_/g, ' ');
    const zPliku = t[3] || t[8] || '';
    $('tytul').value = zPliku && !zPliku.includes('?') ? zPliku : zNazwy;
    // podpis kompozytora: tekst z „mel.”, „muz.”, „sł.” albo pole praw autorskich / dodatkowy tekst
    $('podpis').value = (Object.values(t).find(x => /^(mel|muz|sł|sl|opr)\.?/i.test(x)) || t[10] || t[2] || '').replace(/^(mel|muz|sł|sl|opr)\.?:\s*/i, '$1. ');
    // przedtakt: gdy metrum zmienia się przed końcem pierwszego taktu (np. 2/8, potem 6/8), pierwsze metrum to tylko przedtakt —
    // biorę drugie, a przedtakt dopełniam z przodu pauzą, żeby kreski taktowe wypadły tam, gdzie w pliku
    let mt = M.metrum && [2, 4, 8].includes(M.metrum.dol) ? M.metrum : { gora: 4, dol: 4 }, dopelnij = 0;

      const T2 = m2.gora * 16 / m2.dol, przed16 = Math.round(m2.tick / (M.tpq / 4));
      if (przed16 > 0 && przed16 < T2) { mt = m2; dopelnij = T2 - przed16; }
    }

    if (![...$('metrum').options].some(o => o.value === mt.gora + '/' + mt.dol)) $('metrum').insertAdjacentHTML('beforeend', `<option>${mt.gora}/${mt.dol}</option>`);
    ciag = ciagZMidi(M); zazn = -1; historia = []; stron = 1; strona = 0; konce = new Set(); fEd = null; zamknijOkienko();

$('graj').onclick = () => {
  if (granie) { stopGrania(); return; }
  if (!ciag || !ciag.length) return;
  const ac = audio(), s16 = 60 / ust.tempo / 4, start = ac.currentTime + .1, osc = [], czasy = [];
  zamknijOkienko(); let t = 0; const odZazn = 0, przed = ciag.slice(0, odZazn).reduce((s, e) => s + e.d, 0);
  ciag.forEach((e, i) => {
    if (i >= odZazn) {
      const kiedy = (t - przed) * s16;
      if (e.n != null) osc.push(ton(e.n, start + kiedy, e.d * s16 * .95));
      const nrTaktu = Math.floor(t / dlT());
      czasy.push(setTimeout(() => { zazn = i; const sp = Math.floor(Math.floor(nrTaktu / uklad.naLinie) / uklad.lpp); if (sp !== strona) strona = sp; pokaz(); }, (kiedy + .1) * 1000));
    }
    t += e.d;
  });
  czasy.push(setTimeout(stopGrania, ((t - przed) * s16 + .3) * 1000));
  granie = { osc, czasy }; $('graj').textContent = '⏹ Stop'; $('graj').classList.add('gra');
};

// ===== zapis MIDI (format 0, 480 kroków na ćwierćnutę) — dalej to jest MIDI =====
const PL = { ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z', Ą: 'A', Ć: 'C', Ę: 'E', Ł: 'L', Ń: 'N', Ó: 'O', Ś: 'S', Ź: 'Z', Ż: 'Z' };
const nazwaPliku = (t, kon) => (t || 'nuty').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, z => PL[z]).replace(/[^\w .()-]+/g, '').trim().replace(/\s+/g, '_') + kon;
// polskie litery w tekstach MIDI zapisuję w kodowaniu Windows-1250 (tak samo czyta je ten program)
const CP1250 = { ą: 0xb9, ć: 0xe6, ę: 0xea, ł: 0xb3, ń: 0xf1, ó: 0xf3, ś: 0x9c, ź: 0x9f, ż: 0xbf, Ą: 0xa5, Ć: 0xc6, Ę: 0xca, Ł: 0xa3, Ń: 0xd1, Ó: 0xd3, Ś: 0x8c, Ź: 0x8f, Ż: 0xaf };
const bajtyTekstu = s => [...s].map(c => CP1250[c] || (c.charCodeAt(0) < 128 ? c.charCodeAt(0) : 63));
function pobierz(blob, nazwa) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nazwa; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
$('zapiszMidi').onclick = () => {
  if (!ciag) return;
  const b = [], vlq = v => { const w = [v & 0x7f]; while ((v >>= 7)) w.unshift((v & 0x7f) | 0x80); b.push(...w); };
  const meta = (typ, dane) => { b.push(0, 0xff, typ); vlq(dane.length); b.push(...dane); };
  const tytul = $('tytul').value.trim(), podpis = $('podpis').value.trim(), us = Math.round(60000000 / ust.tempo);
  if (tytul) meta(0x03, bajtyTekstu(tytul));
  if (podpis) meta(0x01, bajtyTekstu(podpis));
  meta(0x58, [ust.gora, Math.log2(ust.dol), 24, 8]);
  meta(0x59, [ust.k & 0xff, 0]);
  meta(0x51, [(us >> 16) & 255, (us >> 8) & 255, us & 255]);
  // zdarzenia po czasie: nuty i funkcje (funkcja = znacznik tekstowy w miejscu, gdzie stoi); 480 kroków na ćwierćnutę → 120 na szesnastkę
  const zd = []; let t = 0;
  for (const e of ciag) { if (e.n != null) { zd.push({ t: t * 120, k: 1, b: [0x90, e.n, 90] }); zd.push({ t: (t + e.d) * 120, k: 0, b: [0x80, e.n, 0] }); } t += e.d; }
  funkcje.forEach(f => { const tx = bajtyTekstu(f.tekst), w = []; let v = tx.length; w.push(v & 0x7f); while ((v >>= 7)) w.unshift((v & 0x7f) | 0x80); zd.push({ t: f.t * 120, k: 0.5, b: [0xff, 0x06, ...w, ...tx] }); });
  zd.sort((x, y) => x.t - y.t || x.k - y.k);                            // w tej samej chwili: puszczenie, znacznik, wciśnięcie
  let teraz = 0;
  for (const z of zd) { vlq(z.t - teraz); b.push(...z.b); teraz = z.t; }
  vlq(t * 120 - teraz); b.push(0xff, 0x2f, 0x00);
  const nag = [0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 0, 0, 1, 0x01, 0xe0], dl = b.length;
  pobierz(new Blob([new Uint8Array([...nag, 0x4d, 0x54, 0x72, 0x6b, (dl >>> 24) & 255, (dl >>> 16) & 255, (dl >>> 8) & 255, dl & 255, ...b])], { type: 'audio/midi' }), nazwaPliku(tytul, '.mid'));
};

// ===== zapis PNG (1302 × 681 — trzy razy kartka), bez złotego zaznaczenia =====
$('zapisz').onclick = async () => {
  if (!ciag) return;
  const ile = uklad.ileStron, tytul = $('tytul').value.trim();
  for (let sp = 0; sp < ile; sp++) {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(rysujStrone(true, { strona: sp }).svg);
    await img.decode();
    const c = document.createElement('canvas'); c.width = W * SKALA_PNG; c.height = H * SKALA_PNG;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/png'));
    pobierz(b, nazwaPliku(tytul, ile === 1 ? '.png' : `_${sp + 1}.png`));
    if (sp < ile - 1) await new Promise(r => setTimeout(r, 400));     // przeglądarka lepiej przyjmuje kilka plików po kolei
  }
};
